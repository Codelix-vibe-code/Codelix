schema_version = "1.0"

[runtime]
request_timeout_seconds = 60
max_file_bytes = 204800
correction_attempts = 2
network_retries = 2

[providers.gemini]
base_url = "https://generativelanguage.googleapis.com/v1beta"
api_key_env = "GEMINI_API_KEY"

[providers.nvidia]
base_url = "https://integrate.api.nvidia.com/v1"
api_key_env = "Nvidia_API_KEY"

[providers.groq]
base_url = "https://api.groq.com/openai/v1"
api_key_env = "Groq_API_KEY"

[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "Openrouter_API_KEY"

[providers.mistral]
base_url = "https://api.mistral.ai/v1"
api_key_env = "Mistral_API_KEY"

[models]
# Ordered candidates; GPT-OSS is the account-tested NVIDIA fallback.
planner = ["gemini:gemini-3.8-flash", "nvidia:openai/gpt-oss-20b", "nvidia:z-ai/glm-5.3"]
coder = ["nvidia:openai/gpt-oss-20b", "nvidia:z-ai/glm-5.3"]
tester = ["nvidia:openai/gpt-oss-20b", "gemini:gemini-3.7-flash", "groq:openai/gpt-oss-20b"]

[verifier]
# Les commandes restent désactivées tant qu'elles n'ont pas été approuvées.
allowed_commands = []
