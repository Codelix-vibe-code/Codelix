schema_version = "1.0"

[runtime]
request_timeout_seconds = 300
max_file_bytes = 204800
correction_attempts = 2
network_retries = 1

[providers.gemini]
base_url = "https://generativelanguage.googleapis.com/v1"
api_key_env = "GEMINI_API_KEY"

[providers.nvidia]
base_url = "https://integrate.api.nvidia.com/v1"
api_key_env = "Nvidia_API_KEY"

[providers.groq]
base_url = "https://api.groq.com/openai/v1"
api_key_env = "Groq_API_KEY"

[models]
# Les candidats sont ordonnés et au format "fournisseur:identifiant".
# Exemples à activer après choix des modèles accessibles dans chaque compte.
# planner = ["gemini:ID_MODELE", "nvidia:ID_MODELE", "groq:ID_MODELE"]
planner = []
coder = []
tester = []

[verifier]
# Les commandes restent désactivées tant qu'elles n'ont pas été approuvées.
allowed_commands = []
