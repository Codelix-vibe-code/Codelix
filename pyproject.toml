[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codelix"
version = "0.1.0"
description = "Vybelix — orchestrateur multi-modèles d'IA pour le développement logiciel"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
codelix = "codelix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codelix = ["ui_assets/*"]

[tool.unittest]
start-directory = "tests"
