[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vybelix"
version = "0.1.0"
description = "Vybelix — orchestrateur multi-modèles d'IA pour le développement logiciel"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pywebview==6.2.1"]

[project.scripts]
vybelix = "vybelix.cli:main"
codelix = "vybelix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vybelix = ["ui_assets/*"]

[tool.unittest]
start-directory = "tests"
